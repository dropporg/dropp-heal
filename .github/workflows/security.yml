name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories appear after code is merged, so re-scan the tree weekly.
    - cron: "17 6 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install scanners
        run: pip install bandit pip-audit

      # Static analysis of our own code.
      - name: Scan code
        run: bandit -q -r api main.py worker.py

      # Known advisories in the pinned dependencies.
      - name: Audit dependencies
        run: pip-audit -r requirements.txt --progress-spinner off

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Moderate findings in a build-time dependency are not worth failing a
      # pull request over; high and critical are.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The gitleaks tool is MIT licensed; only the marketplace action requires
      # a paid licence for organisation repositories, so run the binary.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - uses: actions/checkout@v4
        with:
          # A secret is still a leak once it is committed, so scan the history
          # rather than only the current tree.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      # Exits non-zero on a finding. Values that only look like secrets are
      # allowlisted by value in .gitleaks.toml.
      - name: Scan commit history
        run: gitleaks git . --redact --no-banner

      - name: Scan working tree
        run: gitleaks dir . --redact --no-banner
