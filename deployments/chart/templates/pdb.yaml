{{- if and .Values.api.enabled .Values.api.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "heal.fullname" . }}-api
  labels:
    {{- include "heal.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "heal.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
---
{{- if and .Values.worker.enabled .Values.worker.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "heal.fullname" . }}-worker
  labels:
    {{- include "heal.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  minAvailable: {{ .Values.worker.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "heal.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
{{- end }}
---
{{- if and .Values.dashboard.enabled .Values.dashboard.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "heal.fullname" . }}-dashboard
  labels:
    {{- include "heal.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  minAvailable: {{ .Values.dashboard.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "heal.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
{{- end }}
