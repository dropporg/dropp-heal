{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "heal.fullname" . }}-dashboard
  labels:
    {{- include "heal.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  {{- if not .Values.dashboard.autoscaling.enabled }}
  replicas: {{ .Values.dashboard.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "heal.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "heal.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
      annotations:
        {{- with .Values.dashboard.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # The heal-api Service would set HEAL_API_PORT, which collides with the
      # app's HEAL_API_ config prefix. See api-deployment.yaml.
      enableServiceLinks: false
      serviceAccountName: {{ include "heal.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: dashboard
          image: {{ include "heal.image" (dict "root" $ "component" .Values.dashboard) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # Read at runtime by the Next rewrite, so one image serves every
            # environment. The browser only calls the dashboard's own origin, so
            # there is no CORS to configure.
            - name: HEAL_API_URL
              value: {{ .Values.dashboard.apiUrl | default (printf "http://%s-api:%v" (include "heal.fullname" .) .Values.api.service.port) | quote }}
            {{- with (include "heal.extraEnvVars" (dict "root" $ "component" .Values.dashboard)) }}
            {{- . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.dashboard.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
