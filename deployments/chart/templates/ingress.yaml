{{- if .Values.ingress.enabled }}
{{- $component := .Values.ingress.service | default "dashboard" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "heal.fullname" . }}-{{ $component }}
  labels:
    {{- include "heal.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "heal.fullname" $ }}-{{ $component }}
                port:
                  number: {{ if eq $component "api" }}{{ $.Values.api.service.port }}{{ else }}{{ $.Values.dashboard.service.port }}{{ end }}
          {{- end }}
    {{- end }}
{{- end }}
