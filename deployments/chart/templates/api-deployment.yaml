{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "heal.fullname" . }}-api
  labels:
    {{- include "heal.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "heal.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "heal.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # Roll the pods when configuration changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- include "heal.metricsAnnotations" . | nindent 8 }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # The kubelet sets a variable per Service in the namespace, so the heal-api
      # Service becomes HEAL_API_PORT="tcp://10.96.x.x:80". The app reads its
      # config from the HEAL_API_ prefix, so that lands on its `port` field and
      # start-up dies with a pydantic ValidationError before it logs anything.
      #
      # It only shows up once the Service exists, so a first install can pass and
      # every rollout after it fail.
      enableServiceLinks: false
      serviceAccountName: {{ include "heal.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "heal.image" (dict "root" $ "component" .Values.api) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with (include "heal.extraEnvVars" (dict "root" $ "component" .Values.api)) }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          envFrom:
            {{- include "heal.envFrom" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet:
              path: /probe/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /probe/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /probe/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
