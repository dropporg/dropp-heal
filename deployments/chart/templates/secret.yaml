{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "heal.fullname" . }}-secrets
  labels:
    {{- include "heal.labels" . | nindent 4 }}
  annotations:
    # The migration Job is a pre-install hook that reads this Secret, so it must
    # exist before the ordinary resources. The weight puts it ahead of the Job's
    # -5. No delete policy, because the Deployments read it too.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
type: Opaque
stringData:
  HEAL_API_DATABASE_PASSWORD: {{ required "secrets.databasePassword or secrets.existingSecret is required" .Values.secrets.databasePassword | quote }}
  HEAL_API_INFLUXDB_TOKEN: {{ required "secrets.influxdbToken or secrets.existingSecret is required" .Values.secrets.influxdbToken | quote }}
  HEAL_API_SENTRY_DSN: {{ .Values.sentry.dsn | quote }}
  {{- range $key, $value := .Values.extraSecretVars }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
