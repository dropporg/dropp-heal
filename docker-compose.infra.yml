# Local test infrastructure only. Credentials are throwaway and match the
# defaults in .env.example; never reuse them outside development.

# Pinned so the project name does not follow the directory name.
name: heal

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: heal
      MYSQL_USER: heal
      MYSQL_PASSWORD: heal
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uheal", "-pheal"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: heal
      DOCKER_INFLUXDB_INIT_PASSWORD: healheal
      DOCKER_INFLUXDB_INIT_ORG: heal
      DOCKER_INFLUXDB_INIT_BUCKET: heal
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: heal-dev-token
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  mysql-data:
  influxdb-data:
  influxdb-config:
